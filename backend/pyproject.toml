[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subcadence-backend"
version = "0.1.0"
description = "SubCadence subscription management backend foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
subcadence-api = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/swagger-ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
